name: Build 500 new cross-feature vocabulary V2

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: english-master-v2-build
  cancel-in-progress: true

jobs:
  build-v2:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'trigger 500-word package 8.1.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate V2
        env:
          DICT_API: https://api.dictionaryapi.dev/api/v2/entries/en/
          HSK_BASE: https://raw.githubusercontent.com/plaktos/hsk_csv/master
          TRANSLATE_API: https://translate.googleapis.com/translate_a/single
          TTS_BASE: https://dict.minhqnd.com/api/v1/tts
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q cmudict nltk
          python3 -c 'import nltk; nltk.download("wordnet", quiet=True)'
          python3 - <<'PY'
          import csv, hashlib, json, os, re, time, urllib.parse, urllib.request
          from pathlib import Path

          ROOT=Path.cwd()
          DATA=ROOT/"data"
          VERSION="8.1.0"
          SOURCE="expansion500_v2"
          NEED=500
          HSK_BASE=os.environ["HSK_BASE"]
          TRANSLATE_API=os.environ["TRANSLATE_API"]
          TTS_BASE=os.environ["TTS_BASE"]
          UA="English-Master-V2-DataBuilder/2.0"

          def readj(name):
              return json.loads((DATA/name).read_text(encoding="utf-8"))

          def writej(name,obj):
              (DATA/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          def norm(s):
              return re.sub(r"\s+"," ",str(s or "").strip().lower())

          def get_json(url,tries=4):
              last=None
              for attempt in range(1,tries+1):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":UA})
                      with urllib.request.urlopen(req,timeout=25) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      last=e
                      if attempt<tries: time.sleep(0.4*attempt)
              raise last

          def get_text(url,tries=4):
              last=None
              for attempt in range(1,tries+1):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":UA})
                      with urllib.request.urlopen(req,timeout=25) as r:
                          return r.read().decode("utf-8")
                  except Exception as e:
                      last=e
                      if attempt<tries: time.sleep(0.4*attempt)
              raise last

          def hash_id(s):
              return hashlib.sha1(str(s).encode("utf-8")).hexdigest()[:10]

          def tts(text,lang):
              return TTS_BASE+"?word="+urllib.parse.quote(str(text))+"&lang="+lang

          def translate(text):
              q=urllib.parse.quote(str(text))
              url=f"{TRANSLATE_API}?client=gtx&sl=en&tl=vi&dt=t&q={q}"
              try:
                  data=get_json(url,3)
                  return "".join(str(part[0]) for part in data[0] if part and part[0]).strip()
              except Exception:
                  return ""

          vocab=readj("vocabulary.json")
          sentences=readj("sentences.json")
          questions=readj("questions.json")
          grammar=readj("grammar.json")
          communication=readj("communication.json")
          trilingual=readj("trilingual.json")

          used_words={norm(x.get("word")) for x in vocab}
          used_words|={norm(x.get("en")) for x in trilingual}

          blocked={
            "a","an","the","and","or","but","if","then","than","so","as","of","to",
            "in","on","at","by","for","from","with","about","into","over","under",
            "not","no","yes","very","more","most","less","least","else","each",
            "both","either","neither","also","just","only","even","still","again",
            "another","other","others","same","such","what","which","who","whom",
            "whose","how","why","where","when"
          }

          candidates={}
          for level in (3,4,5,6):
              raw=get_text(f"{HSK_BASE}/hsk{level}.csv")
              for row in csv.reader(raw.splitlines()):
                  if len(row)<3: continue
                  zh=row[0].strip()
                  py=row[1].strip()
                  raw_en=",".join(row[2:]).strip()
                  word=re.sub(r"^to\s+","",raw_en,flags=re.I)
                  word=re.sub(r"^(?:a|an)\s+","",word,flags=re.I).strip().lower()
                  if not zh or not py or not re.fullmatch(r"[a-z]+",word): continue
                  if word in blocked or len(word)<3 or len(word)>16: continue
                  if word in used_words or word in candidates: continue
                  candidates[word]={"word":word,"zh":zh,"pinyin":py,"rawEn":raw_en,"hsk":level}

          ordered=sorted(candidates.values(),key=lambda x:(x["hsk"],len(x["word"]),x["word"]))

          cmu={}
          try:
              import cmudict
              cmu=cmudict.dict()
          except Exception:
              pass

          def cmu_ipa(word):
              pr=cmu.get(word.lower())
              if not pr: return ""
              table={
                "AA":"ɑ","AE":"æ","AH":"ʌ","AO":"ɔ","AW":"aʊ","AY":"aɪ","EH":"ɛ","ER":"ɝ",
                "EY":"eɪ","IH":"ɪ","IY":"i","OW":"oʊ","OY":"ɔɪ","UH":"ʊ","UW":"u",
                "B":"b","CH":"tʃ","D":"d","DH":"ð","F":"f","G":"ɡ","HH":"h","JH":"dʒ","K":"k",
                "L":"l","M":"m","N":"n","NG":"ŋ","P":"p","R":"r","S":"s","SH":"ʃ","T":"t",
                "TH":"θ","V":"v","W":"w","Y":"j","Z":"z","ZH":"ʒ"
              }
              out=[]; primary=False
              for ph in pr[0]:
                  m=re.fullmatch(r"([A-Z]+)([012]?)",ph)
                  if not m: continue
                  val=table.get(m.group(1),"")
                  if not val: continue
                  if m.group(2)=="1" and not primary:
                      out.append("ˈ");primary=True
                  elif m.group(2)=="2":
                      out.append("ˌ")
                  out.append(val)
              return "/"+"" .join(out)+"/" if out else ""

          reject=[
            re.compile(r"^The (?:room|house|chair|table|book|dictionary|homework|question|answer|company|career|station|airport|mountain|river|bicycle|office|meeting|manager|client|desk|computer|phone|window|door) (?:looks?|is|was|seems?) (?:very )?(?:sad|happy|angry|excited|nervous|tired|lonely|worried|afraid|jealous|proud|surprised|calm|friendly|serious|careful|rich|sure|offline|cloudy|snowy|local|short|sweet)\b",re.I),
            re.compile(r"^(?:He|She) decided to (?:need|know|happen|fail|occur|already|only|slowly|beautifully|probably|just|discover|detect|indicate|expect|elect|react|advertise)\b",re.I),
            re.compile(r"^I need to (?:use|take|look|like|feel|show|spend|lend|beautifully|probably|just) before breakfast\.$",re.I),
            re.compile(r"^They tried to (?:support|continue|establish|wonder|disturb|entertain|express|propose|resolve|serve|submit|thank|appear|gain|accompany|affect|attach|complain|consider|contribute|create|decrease|encourage|estimate|harm|ignore|notice|prevent|recommend) carefully\.$",re.I),
            re.compile(r"^It is (?:hungry|spicy|large|big|low|public) to practice a little every day\.$",re.I),
            re.compile(r"^She sounded (?:delicious|salty|favorite) during the conversation\.$",re.I),
            re.compile(r"^I feel (?:dangerous|full|sour|difficult|common|natural|personal|long|afraid|lazy|weak) when I finish my work\.$",re.I),
            re.compile(r"^I noticed (?:youth|iron|steel|aspect) this morning\.$",re.I),
          ]

          from concurrent.futures import ThreadPoolExecutor

          from nltk.corpus import wordnet as wn

          POS_MAP={"n":"noun","v":"verb","a":"adjective","s":"adjective","r":"adverb"}

          def build_one(c):
              word=c["word"]
              variants=[word]
              for v in (
                  re.sub(r"ies$","y",word),
                  re.sub(r"([^s])s$","\\1",word),
                  re.sub(r"ied$","y",word),
                  re.sub(r"ed$","",word),
                  re.sub(r"ing$","",word),
              ):
                  if v and v not in variants and len(v)>=3:
                      variants.append(v)
              try:
                  synsets=[]
                  for candidate in variants:
                      synsets.extend(wn.synsets(candidate))
                  # Keep order while removing duplicate synsets.
                  uniq=[]; seen_syn=set()
                  for syn in synsets:
                      key=syn.name()
                      if key not in seen_syn:
                          seen_syn.add(key); uniq.append(syn)
                  synsets=uniq
              except Exception:
                  return None
              if not synsets:
                  return None
              example=""; pos=""; matched_form=word
              for candidate in variants:
                  for syn in wn.synsets(candidate):
                      for ex in syn.examples():
                          ex=str(ex).strip()
                          if re.search(r"\\b"+re.escape(candidate)+r"\\b",ex,re.I):
                              example=ex
                              pos=POS_MAP.get(syn.pos(),syn.pos())
                              matched_form=candidate
                              break
                      if example:
                          break
                  if example:
                      break
              if not example:
                  for syn in synsets:
                      for ex in syn.examples():
                          ex=str(ex).strip()
                          if ex:
                              example=ex
                              pos=POS_MAP.get(syn.pos(),syn.pos())
                              matched_form=next((v for v in variants if re.search(r"\\b"+re.escape(v)+r"\\b",ex,re.I)),word)
                              break
                      if example:
                          break
              if not example:
                  try:
                      entries=get_json(DICT_API+urllib.parse.quote(word),3)
                      if isinstance(entries,list) and entries:
                          entry=entries[0] if isinstance(entries[0],dict) else {}
                          for m in entry.get("meanings",[]) or []:
                              for d in m.get("definitions",[]) or []:
                                  ex=str(d.get("example") or "").strip()
                                  if ex:
                                      example=ex
                                      pos=str(m.get("partOfSpeech") or "") or pos
                                      break
                              if example:
                                  break
                  except Exception:
                      pass
              if not example or len(example.split())<4 or len(example.split())>26:
                  return None
              if any(rx.search(example) for rx in reject):
                  return None
              actual_word=word
              if matched_form!=word:
                  actual_word=matched_form
              phon=cmu_ipa(actual_word) or cmu_ipa(word)
              if not phon:
                  return None
              vi=translate(str(c["rawEn"])+" ||| "+example)
              if "|||" not in vi:
                  return None
              meaning_vi,example_vi=[z.strip() for z in vi.split("|||",1)]
              if not meaning_vi or not example_vi:
                  return None
              return {**c,"word":actual_word,"originalWord":word,"pos":pos,"phonetic":phon,
                      "meaningVi":meaning_vi,"example":example,"exampleVi":example_vi}



          chosen=[]; used_examples=set(); used_words_v2=set()
          for start in range(0,len(ordered),100):
              batch=ordered[start:start+100]
              with ThreadPoolExecutor(max_workers=6) as pool:
                  futures=[pool.submit(build_one,c) for c in batch]
                  results=[f.result() for f in futures]
              for row in results:
                  if not row:
                      continue
                  k=norm(row["example"]); wk=norm(row["word"])
                  if k in used_examples or wk in used_words_v2 or wk in used_words:
                      continue
                  used_examples.add(k); used_words_v2.add(wk)
                  chosen.append(row)
                  if len(chosen)>=NEED:
                      break
              if len(chosen)>=NEED:
                  break

          if len(chosen)<NEED:
              raise SystemExit(f"Only {len(chosen)} verified new words available; expected {NEED}.")

          def topic(word):
              groups={
                "school":["school","student","teacher","class","lesson","exam","homework","college","university","study","education","library","research","degree"],
                "work":["job","work","office","company","boss","manager","worker","meeting","business","career","project","report","salary","department","factory","customer"],
                "travel":["travel","trip","airport","station","train","bus","taxi","hotel","passport","flight","tour","journey","ticket","tourist","map","road"],
                "food":["food","meal","breakfast","lunch","dinner","restaurant","menu","bread","rice","noodle","soup","cake","fruit","vegetable","drink","taste"],
                "health":["health","doctor","hospital","medicine","exercise","ill","sick","fever","pain","body","heart","head","stomach","sleep"],
                "home":["home","house","room","kitchen","bathroom","door","window","table","chair","bed","family","parent","child","neighbor"],
                "shopping":["shop","shopping","buy","sell","price","cheap","expensive","market","store","clothes","shirt","shoe","size","discount"],
                "technology":["computer","phone","internet","email","screen","keyboard","software","technology","machine","online","website","video","camera"],
                "weather":["weather","rain","snow","wind","storm","cloud","sun","summer","winter","spring","autumn","temperature"],
                "feelings":["happy","sad","angry","afraid","worry","hope","love","hate","excited","tired","quiet","nervous","surprise","fear"],
                "city":["city","street","building","park","station","bridge","traffic","car","road","town","village","country"],
                "nature":["tree","flower","animal","river","mountain","forest","earth","land","sea","water","fire","air"]
              }
              w=word.lower()
              for k,vals in groups.items():
                  if any(v in w for v in vals): return k
              return "daily"

          new_vocab=[];new_sentences=[];new_tri=[]
          for i,x in enumerate(chosen,1):
              tp=topic(x["word"])
              level="Beginner" if x["hsk"]<=3 else ("Intermediate" if x["hsk"]<=4 else "Upper-Intermediate")
              hid=hash_id(x["word"])
              v={
                "id":f"exp500v2_{i:03d}_{hid}","word":x["word"],
                "ipa":x["phonetic"],"meaning":x["meaningVi"],"pos":x["pos"] or "word",
                "example":x["example"],"exampleVi":x["exampleVi"],
                "synonyms":"","antonyms":"","topic":tp,"level":level,
                "favorite":False,"status":"New","reviewDue":None,
                "createdAt":"2026-09-28T00:00:00.000Z","audio":"tts",
                "audioEn":tts(x["word"],"en"),"source":SOURCE,"sourceVersion":VERSION
              }
              new_vocab.append(v)
              new_sentences.append({
                "id":f"exp500v2_sent_{i:03d}_{hid}","en":x["example"],"vi":x["exampleVi"],
                "topic":tp,"grammar":"Everyday English","audioEn":tts(x["example"],"en"),
                "favorite":False,"source":SOURCE,"sourceVersion":VERSION
              })
              new_tri.append({
                "id":f"exp500v2_tri_{i:03d}_{hid}","en":x["word"],"zh":x["zh"],
                "pinyin":x["pinyin"],"vi":x["meaningVi"],"topic":tp,"level":level,
                "audio":"tts","audioEn":tts(x["word"],"en"),"audioZh":tts(x["zh"],"zh"),
                "audioVi":tts(x["meaningVi"],"vi"),"source":SOURCE,"sourceVersion":VERSION
              })

          # Two quiz modes per new word: meaning + word-in-context.
          all_meanings=[str(x.get("meaning") or "").strip() for x in vocab+new_vocab if str(x.get("meaning") or "").strip()]
          all_meanings_unique=[]
          seen_m=set()
          for m in all_meanings:
              k=norm(m)
              if k and k not in seen_m:
                  seen_m.add(k);all_meanings_unique.append(m)
          all_words=[str(x.get("word") or "").strip() for x in vocab+new_vocab if str(x.get("word") or "").strip()]
          new_questions=[]
          for i,v in enumerate(new_vocab,1):
              meaning=v["meaning"]
              distract=[m for m in all_meanings_unique if norm(m)!=norm(meaning)][:3]
              if len(distract)<3: raise SystemExit("Not enough unique meaning distractors")
              opts=[meaning,*distract]
              shift=(i*5)%4
              opts=opts[shift:]+opts[:shift]
              new_questions.append({
                "id":f"exp500v2_qm_{i:03d}_{hash_id(v['word'])}","type":"multiple",
                "prompt":f'"{v["word"]}" nghĩa là gì?',"options":opts,
                "answer":opts.index(meaning),"explain":f'{v["word"]} = {meaning}.',
                "topic":v["topic"],"level":v["level"],"vocabWord":v["word"],
                "audio":"tts","audioEn":tts(v["word"],"en"),"source":SOURCE,"sourceVersion":VERSION
              })
              blank=re.sub(r"\b"+re.escape(v["word"])+r"\b","_____",v["example"],count=1,flags=re.I)
              word_opts=[v["word"]]
              for w in all_words:
                  if norm(w)!=norm(v["word"]) and norm(w) not in {norm(z) for z in word_opts}:
                      word_opts.append(w)
                  if len(word_opts)==4: break
              if len(word_opts)<4: raise SystemExit("Not enough word distractors")
              shift=(i*3)%4
              word_opts=word_opts[shift:]+word_opts[:shift]
              new_questions.append({
                "id":f"exp500v2_qc_{i:03d}_{hash_id(v['word'])}","type":"multiple",
                "prompt":blank,"options":word_opts,"answer":word_opts.index(v["word"]),
                "explain":f'Từ phù hợp là "{v["word"]}".',"topic":v["topic"],"level":v["level"],
                "vocabWord":v["word"],"audio":"tts","audioEn":tts(blank,"en"),
                "source":SOURCE,"sourceVersion":VERSION
              })

          new_comm=[]
          patterns=[
            ('I came across the word "{w}" today.','Can you use it in a sentence?','That example makes the meaning clear.'),
            ('I learned the word "{w}" today.','What sentence helps you remember it?','That context is easy to picture.'),
            ('I am practicing "{w}" today.','How would you use it naturally?','That sounds natural in context.'),
            ('I want to remember "{w}".','Can you read an example aloud?','Yes, that helps me remember it.')
          ]
          for start in range(0,NEED,5):
              group=new_vocab[start:start+5]
              lines=[]
              for j,v in enumerate(group):
                  p=patterns[j%len(patterns)]
                  lines.extend([
                    ["A",p[0].format(w=v["word"]),f'Hôm nay tôi bắt gặp từ "{v["word"]}".'],
                    ["B",p[1],"Bạn có thể dùng nó trong một câu không?"],
                    ["A",v["example"],v["exampleVi"]],
                    ["B",p[2],"Ví dụ đó giúp tôi hiểu/nghi nhớ cách dùng."]
                  ])
              new_comm.append({
                "id":f"exp500v2_comm_{start//5+1:03d}",
                "title":f"Luyện giao tiếp từ mới {start//5+1:03d}",
                "topic":group[0]["topic"],
                "vocab":[v["word"] for v in group],"lines":lines,
                "source":SOURCE,"sourceVersion":VERSION
              })

          new_grammar=[]
          for start in range(0,NEED,25):
              group=new_vocab[start:start+25]
              new_grammar.append({
                "id":f"exp500v2_grammar_{start//25+1:02d}",
                "title":f"Từ mới trong ngữ cảnh — {group[0]['topic']}",
                "level":"Beginner–Intermediate",
                "formula":"Target word + natural example in context",
                "explain":"Đọc câu ví dụ, nghe câu và nói lại câu để ghi nhớ cách dùng thực tế.",
                "examples":[v["example"] for v in group],
                "notes":"Gói 500 từ mới V2.",
                "vocabWords":[v["word"] for v in group],
                "source":SOURCE,"sourceVersion":VERSION
              })

          final_vocab=vocab+new_vocab
          final_sentences=sentences+new_sentences
          final_questions=questions+new_questions
          final_tri=trilingual+new_tri
          final_comm=communication+new_comm
          final_grammar=grammar+new_grammar

          writej("vocabulary.json",final_vocab)
          writej("sentences.json",final_sentences)
          writej("questions.json",final_questions)
          writej("trilingual.json",final_tri)
          writej("communication.json",final_comm)
          writej("grammar.json",final_grammar)
          writej("expansion500_v2.json",{
            "package":SOURCE,"version":VERSION,"count":NEED,
            "words":[
              {"word":new_vocab[i]["word"],"vocabId":new_vocab[i]["id"],
               "sentenceId":new_sentences[i]["id"],
               "questionIds":[new_questions[i*2]["id"],new_questions[i*2+1]["id"]],
               "trilingualId":new_tri[i]["id"],
               "communicationId":new_comm[i//5]["id"],
               "grammarId":new_grammar[i//25]["id"]}
              for i in range(NEED)
            ]
          })

          writej("version.json",{
            "version":VERSION,"updatedAt":"2026-09-28",
            "releaseNotes":"V8.1.0: thêm đúng 500 từ mới đã xác thực qua từ điển, mỗi từ có IPA, nghĩa Việt, câu ví dụ theo ngữ cảnh, audio; đồng thời nối vào đọc, nghe, nói, flashcards, quiz ngữ nghĩa, quiz theo ngữ cảnh, ôn tập, tam ngữ, giao tiếp và ngữ pháp.",
            "files":{"vocabulary":"vocabulary.json","sentences":"sentences.json","questions":"questions.json","grammar":"grammar.json","communication":"communication.json","trilingual":"trilingual.json"},
            "expansion":{"package":SOURCE,"count":500}
          })

          assert len(new_vocab)==500 and len({norm(x["word"]) for x in new_vocab})==500
          assert all(x.get("ipa") and x.get("meaning") and x.get("example") and x.get("exampleVi") and x.get("audioEn") for x in new_vocab)
          assert len(new_sentences)==500 and all(x.get("en") and x.get("vi") and x.get("audioEn") and not x.get("vocabWord") for x in new_sentences)
          assert len(new_questions)==1000 and all(len(x["options"])==4 and len({norm(z) for z in x["options"]})==4 and 0<=x["answer"]<4 for x in new_questions)
          assert len(new_tri)==500 and all(x.get("en") and x.get("zh") and x.get("pinyin") and x.get("vi") and x.get("audioEn") and x.get("audioZh") and x.get("audioVi") for x in new_tri)
          assert len(new_comm)==100 and all(len(d.get("lines",[]))==20 for d in new_comm)
          assert len(new_grammar)==20 and all(len(g.get("examples",[]))==25 and len(g.get("vocabWords",[]))==25 for g in new_grammar)
          assert sum(x.get("source")==SOURCE for x in final_vocab)==500
          assert sum(x.get("source")==SOURCE for x in final_sentences)==500
          assert sum(x.get("source")==SOURCE for x in final_questions)==1000
          assert sum(x.get("source")==SOURCE for x in final_tri)==500
          assert sum(x.get("source")==SOURCE for x in final_comm)==100
          assert sum(x.get("source")==SOURCE for x in final_grammar)==20
          assert all(re.search(r"\b"+re.escape(x["word"])+r"\b",x["example"],re.I) for x in new_vocab)

          print(json.dumps({
            "status":"PASS","newWords":500,"vocabTotal":len(final_vocab),
            "sentencesAdded":500,"questionsAdded":1000,"trilingualAdded":500,
            "communicationAdded":100,"grammarAdded":20,
            "audioWordTargets":500,"audioSentenceTargets":500,
            "reading":500,"listening":500,"speaking":500,"quiz":1000,"review":500
          },ensure_ascii=False,indent=2))
          PY

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "V8.1.0: add 500 new cross-feature vocabulary [data-build]"
          git push
