name: Build verified 500-word V2 package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: english-master-v2-build
  cancel-in-progress: true

jobs:
  build-v2:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'trigger 500-word package 8.1.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate 500-word package from static snapshots
        env:
          HSK_BASE: https://raw.githubusercontent.com/plaktos/hsk_csv/master
          TATOEBA_SNAPSHOT: https://raw.githubusercontent.com/quangpromise/LearningEnglish/main/scripts/english_path/data/tatoeba_eng_vie.tsv
          MYMEMORY_API: https://api.mymemory.translated.net/get
          TTS_BASE: https://dict.minhqnd.com/api/v1/tts
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q cmudict
          python3 - <<'PY'
          import csv, hashlib, json, os, re, urllib.parse, urllib.request
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor

          ROOT=Path.cwd()
          DATA=ROOT/"data"
          VERSION="8.1.0"
          SOURCE="expansion500_v2"
          NEED=500
          UA="English-Master-500V2/2.0"

          def fetch_text(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=120) as r:
                  return r.read().decode("utf-8")

          def readj(name):
              return json.loads((DATA/name).read_text(encoding="utf-8"))

          def writej(name,obj):
              (DATA/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          def norm(s):
              return re.sub(r"\s+"," ",str(s or "").strip().lower())

          def tts(text,lang):
              return os.environ["TTS_BASE"]+"?word="+urllib.parse.quote(str(text))+"&lang="+lang

          vocab=readj("vocabulary.json")
          sentences=readj("sentences.json")
          questions=readj("questions.json")
          grammar=readj("grammar.json")
          communication=readj("communication.json")
          trilingual=readj("trilingual.json")

          used={norm(v.get("word")) for v in vocab}
          used|={norm(x.get("en")) for x in trilingual}

          # ---- A. HSK candidate words ----
          hsk={}
          for level in (2,3,4,5,6):
              raw=fetch_text(f"{os.environ['HSK_BASE']}/hsk{level}.csv")
              for row in csv.reader(raw.splitlines()):
                  if len(row)<3: continue
                  zh=row[0].strip(); py=row[1].strip(); raw_en=",".join(row[2:]).strip()
                  word=re.sub(r"^to\s+","",raw_en,flags=re.I)
                  word=re.sub(r"^(?:a|an)\s+","",word,flags=re.I).strip().lower()
                  if not zh or not py or not re.fullmatch(r"[a-z]+",word): continue
                  if not 3<=len(word)<=15 or word in used: continue
                  hsk.setdefault(word,{"word":word,"zh":zh,"pinyin":py,"rawEn":raw_en,"hsk":level})
          print("HSK candidates:",len(hsk))

          # ---- B. IPA from CMUdict + Vietnamese meaning from HSK gloss ----
          import subprocess, sys
          subprocess.check_call([sys.executable,"-m","pip","install","-q","cmudict"])
          import cmudict
          CMU=cmudict.dict()
          IPA_MAP={
            "AA":"ɑ","AE":"æ","AH":"ʌ","AO":"ɔ","AW":"aʊ","AY":"aɪ","EH":"ɛ","ER":"ɝ",
            "EY":"eɪ","IH":"ɪ","IY":"i","OW":"oʊ","OY":"ɔɪ","UH":"ʊ","UW":"u",
            "B":"b","CH":"tʃ","D":"d","DH":"ð","F":"f","G":"ɡ","HH":"h","JH":"dʒ","K":"k",
            "L":"l","M":"m","N":"n","NG":"ŋ","P":"p","R":"r","S":"s","SH":"ʃ","T":"t",
            "TH":"θ","V":"v","W":"w","Y":"j","Z":"z","ZH":"ʒ"
          }
          def ipa(word):
              p=CMU.get(word.lower())
              if not p: return ""
              out=[]; stressed=False
              for ph in p[0]:
                  m=re.fullmatch(r"([A-Z]+)([012]?)",ph)
                  if not m: continue
                  v=IPA_MAP.get(m.group(1))
                  if not v: continue
                  if m.group(2)=="1" and not stressed:
                      out.append("ˈ"); stressed=True
                  elif m.group(2)=="2":
                      out.append("ˌ")
                  out.append(v)
              return "/"+"" .join(out)+"/" if out else ""

          def translate_vi(text):
              q=urllib.parse.urlencode({"q":str(text),"langpair":"en|vi"})
              try:
                  req=urllib.request.Request(os.environ["MYMEMORY_API"]+"?"+q,headers={"User-Agent":UA})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      d=json.loads(r.read().decode("utf-8"))
                  v=str((d.get("responseData") or {}).get("translatedText") or "").strip()
                  if v and "MYMEMORY WARNING" not in v.upper():
                      return v
              except Exception:
                  return ""
              return ""

          candidates=[x for x in hsk.values() if ipa(x["word"])]
          candidates.sort(key=lambda x:(x["hsk"],len(x["word"]),x["word"]))
          print("Candidates with IPA:",len(candidates))

          def enrich(x):
              vi=translate_vi(x["rawEn"])
              if not vi: return None
              return {**x,"ipa":ipa(x["word"]),"meaningVi":vi}

          with ThreadPoolExecutor(max_workers=8) as pool:
              enriched=[x for x in pool.map(enrich,candidates) if x]
          print("Enriched HSK words:",len(enriched))
          if len(enriched)<NEED:
              raise SystemExit(f"Only {len(enriched)} new words have IPA + Vietnamese meaning; expected {NEED}.")
          enriched=sorted(enriched,key=lambda x:(x["hsk"],len(x["word"]),x["word"]))

          # ---- C. Official Tatoeba EN-VI export ----
          import bz2, io

          BASE="https://downloads.tatoeba.org/exports/per_language"
          def fetch_bz2(url):
              raw=fetch_text(url)
              return raw

          target_words={x["word"] for x in enriched}

          # Read English sentences once; retain only sentences that can teach a target word.
          eng_url=BASE+"/eng/eng_sentences.tsv.bz2"
          eng_data=fetch_bytes=__import__("urllib.request").request.urlopen(
              __import__("urllib.request").request.Request(eng_url,headers={"User-Agent":UA}),timeout=180
          ).read()
          relevant_eng={}
          for line in bz2.decompress(eng_data).decode("utf-8").splitlines():
              parts=line.split("\t",1)
              if len(parts)!=2: continue
              sid,textv=parts[0].strip(),parts[1].strip()
              if not textv: continue
              toks=set(re.findall(r"[A-Za-z]+",textv.lower()))
              if not toks.intersection(target_words): continue
              relevant_eng[sid]=textv

          print("Relevant English Tatoeba sentences:",len(relevant_eng))

          # Pair relevant English sentence IDs with Vietnamese IDs.
          link_url=BASE+"/eng/eng-vie_links.tsv.bz2"
          link_data=__import__("urllib.request").request.urlopen(
              __import__("urllib.request").request.Request(link_url,headers={"User-Agent":UA}),timeout=120
          ).read()
          eng_to_vie={}
          wanted_vie=set()
          for line in bz2.decompress(link_data).decode("utf-8").splitlines():
              parts=line.split("\t")
              if len(parts)<2: continue
              eid,vid=parts[0].strip(),parts[1].strip()
              if eid in relevant_eng:
                  eng_to_vie.setdefault(eid,[]).append(vid)
                  wanted_vie.add(vid)

          print("Relevant EN-VI links:",sum(len(v) for v in eng_to_vie.values()))

          # Read Vietnamese sentences only for linked IDs we actually need.
          vie_url=BASE+"/vie/vie_sentences.tsv.bz2"
          vie_data=__import__("urllib.request").request.urlopen(
              __import__("urllib.request").request.Request(vie_url,headers={"User-Agent":UA}),timeout=180
          ).read()
          vie_map={}
          for line in bz2.decompress(vie_data).decode("utf-8").splitlines():
              parts=line.split("\t",1)
              if len(parts)!=2: continue
              vid,textv=parts[0].strip(),parts[1].strip()
              if vid in wanted_vie and textv:
                  vie_map[vid]=textv

          print("Vietnamese sentences found:",len(vie_map))

          names={"Tom","Mary","John","Muiriel","Ken","Jack","Bob","Jane","Mike","Alice","Paul","Tony","Lucy","Maria","Anna","Emily","Jim","Kate","Sami","Layla","Dan","Linda","Bill","Taro","Hanako","Yanni"}
          bad_patterns=[
            re.compile(r"^(?:the|a|an) (?:room|house|chair|table|book|dictionary|homework|question|answer|company|career|station|airport|mountain|river|bicycle|office|meeting|manager|client|desk|computer|phone|window|door) (?:looks?|is|was|seems?) (?:very )?(?:sad|happy|angry|excited|nervous|tired|lonely|worried|afraid|jealous|proud|surprised|calm|friendly|serious|careful|rich|sure|offline|cloudy|snowy|local|short|sweet)\b",re.I),
            re.compile(r"^i'?m practicing\b",re.I),
            re.compile(r"^(?:when would you use|how can i use|how would you use|can you give me an example with|can you tell me more about)\b",re.I),
            re.compile(r"^i noticed (?:youth|iron|steel) this morning\.$",re.I),
            re.compile(r"^i saw aspect on my way home\.$",re.I)
          ]

          def usable(en):
              toks=en.split()
              if not 4<=len(toks)<=16: return False
              for i,t in enumerate(toks):
                  clean=t.strip(".,!?;:\"'()")
                  if clean in names and i>0: return False
                  if i>0 and clean and clean[:1].isupper() and clean not in {"I","I'm","I've","I'll","I'd"}:
                      return False
              if not re.search(r"[.!?]$",en): return False
              return not any(rx.search(en) for rx in bad_patterns)

          candidate_by_word={}
          for eid,en in relevant_eng.items():
              if not usable(en): continue
              for word in target_words.intersection(set(re.findall(r"[A-Za-z]+",en.lower()))):
                  for vid in eng_to_vie.get(eid,[]):
                      vi=vie_map.get(vid)
                      if not vi: continue
                      candidate_by_word.setdefault(word,[]).append((len(en.split()),eid,vid,en,vi))

          for word in candidate_by_word:
              candidate_by_word[word].sort(key=lambda z:(z[0],z[1],z[2]))

          chosen=[]; used_sentences=set()
          for x in enriched:
              rows=candidate_by_word.get(x["word"],[])
              pick=next((r for r in rows if norm(r[3]) not in used_sentences),None)
              if not pick: continue
              used_sentences.add(norm(pick[3]))
              chosen.append({
                **x,
                "example":pick[3],
                "exampleVi":pick[4],
                "sourceRef":f"tatoeba:eng#{pick[1]}/vie#{pick[2]}"
              })
              if len(chosen)>=NEED: break

          print("Verified words with official EN-VI Tatoeba examples:",len(chosen))
          if len(chosen)<NEED:
              raise SystemExit(f"Only {len(chosen)} new words have official EN-VI examples; expected {NEED}.")

          # ---- D. Build all linked learning modes ----
          def topic(word):
              groups={
                "school":["school","student","teacher","class","lesson","exam","homework","college","university","study","education","library","research","degree"],
                "work":["job","work","office","company","boss","manager","worker","meeting","business","career","project","report","salary","department","factory","customer"],
                "travel":["travel","trip","airport","station","train","bus","taxi","hotel","passport","flight","tour","journey","ticket","tourist","map","road"],
                "food":["food","meal","breakfast","lunch","dinner","restaurant","menu","bread","rice","noodle","soup","cake","fruit","vegetable","drink","taste"],
                "health":["health","doctor","hospital","medicine","exercise","ill","sick","fever","pain","body","heart","head","stomach","sleep"],
                "home":["home","house","room","kitchen","bathroom","door","window","table","chair","bed","family","parent","child","neighbor"],
                "shopping":["shop","shopping","buy","sell","price","cheap","expensive","market","store","clothes","shirt","shoe","size","discount"],
                "technology":["computer","phone","internet","email","screen","keyboard","software","technology","machine","online","website","video","camera"],
                "weather":["weather","rain","snow","wind","storm","cloud","sun","summer","winter","spring","autumn","temperature"],
                "feelings":["happy","sad","angry","afraid","worry","hope","love","hate","excited","tired","quiet","nervous","surprise","fear"],
                "city":["city","street","building","park","station","bridge","traffic","car","road","town","village","country"],
                "nature":["tree","flower","animal","river","mountain","forest","earth","land","sea","water","fire","air"]
              }
              w=word.lower()
              for k,vals in groups.items():
                  if any(v in w for v in vals): return k
              return "daily"

          new_vocab=[]; new_sentences=[]; new_tri=[]
          for i,x in enumerate(chosen,1):
              tp=topic(x["word"])
              level="Beginner" if x["hsk"]==3 else ("Intermediate" if x["hsk"]==4 else "Upper-Intermediate")
              hid=hashlib.sha1(x["word"].encode()).hexdigest()[:10]
              new_vocab.append({
                "id":f"exp500v2_{i:03d}_{hid}","word":x["word"],"ipa":x["ipa"],
                "meaning":x["meaningVi"],"pos":"word","example":x["example"],"exampleVi":x["exampleVi"],
                "synonyms":"","antonyms":"","topic":tp,"level":level,
                "favorite":False,"status":"New","reviewDue":None,"createdAt":"2026-09-28T00:00:00.000Z",
                "audio":"tts","audioEn":tts(x["word"],"en"),"source":SOURCE,"sourceVersion":VERSION,
                "sourceRef":x["sourceRef"],"hsk":x["hsk"]
              })
              new_sentences.append({
                "id":f"exp500v2_sent_{i:03d}_{hid}","en":x["example"],"vi":x["exampleVi"],"topic":tp,
                "grammar":"Everyday English","audioEn":tts(x["example"],"en"),"favorite":False,
                "source":SOURCE,"sourceVersion":VERSION,"sourceRef":x["sourceRef"]
              })
              new_tri.append({
                "id":f"exp500v2_tri_{i:03d}_{hid}","en":x["word"],"zh":x["zh"],"pinyin":x["pinyin"],
                "vi":x["meaningVi"],"topic":tp,"level":level,"audio":"tts",
                "audioEn":tts(x["word"],"en"),"audioZh":tts(x["zh"],"zh"),"audioVi":tts(x["meaningVi"],"vi"),
                "source":SOURCE,"sourceVersion":VERSION
              })

          new_questions=[]
          all_meanings=[]
          for v in vocab+new_vocab:
              m=norm(v.get("meaning"))
              if m and m not in all_meanings: all_meanings.append(m)
          meaning_map={norm(v["meaning"]):v["meaning"] for v in new_vocab}
          all_words=[v["word"] for v in vocab+new_vocab]

          for i,v in enumerate(new_vocab,1):
              correct=v["meaning"]
              ds=[]
              for m in all_meanings:
                  if m!=norm(correct) and m not in {norm(x) for x in ds}:
                      ds.append(meaning_map.get(m,m))
                  if len(ds)==3: break
              if len(ds)<3:
                  raise SystemExit("Not enough unique meaning distractors")
              opts=[correct]+ds
              shift=(i*5)%4; opts=opts[shift:]+opts[:shift]
              new_questions.append({
                "id":f"exp500v2_qm_{i:03d}_{hashlib.sha1(v['word'].encode()).hexdigest()[:10]}",
                "type":"multiple","prompt":f'"{v["word"]}" nghĩa là gì?',"options":opts,
                "answer":opts.index(correct),"explain":f'{v["word"]} = {correct}.',
                "topic":v["topic"],"level":v["level"],"vocabWord":v["word"],"audio":"tts",
                "audioEn":tts(v["word"],"en"),"source":SOURCE,"sourceVersion":VERSION
              })

              blank=re.sub(r"\b"+re.escape(v["word"])+r"\b","_____",v["example"],count=1,flags=re.I)
              word_opts=[v["word"]]
              for w in all_words:
                  if norm(w)!=norm(v["word"]) and norm(w) not in {norm(z) for z in word_opts}:
                      word_opts.append(w)
                  if len(word_opts)==4: break
              if len(word_opts)<4: raise SystemExit("Not enough word distractors")
              shift=(i*3)%4; word_opts=word_opts[shift:]+word_opts[:shift]
              new_questions.append({
                "id":f"exp500v2_qc_{i:03d}_{hashlib.sha1(v['word'].encode()).hexdigest()[:10]}",
                "type":"multiple","prompt":blank,"options":word_opts,"answer":word_opts.index(v["word"]),
                "explain":f'Từ phù hợp là "{v["word"]}".',"topic":v["topic"],"level":v["level"],
                "vocabWord":v["word"],"audio":"tts","audioEn":tts(blank,"en"),
                "source":SOURCE,"sourceVersion":VERSION
              })

          new_comm=[]
          for start in range(0,NEED,5):
              group=new_vocab[start:start+5]
              lines=[]
              for v in group:
                  lines.extend([
                    ["A","I found a useful word while reading today.","Tôi gặp một từ hữu ích khi đọc hôm nay."],
                    ["B","Where did you see it?","Bạn thấy nó ở đâu?"],
                    ["A",v["example"],v["exampleVi"]],
                    ["B","The context makes the meaning easier to remember.","Ngữ cảnh giúp nhớ nghĩa dễ hơn."]
                  ])
              new_comm.append({
                "id":f"exp500v2_comm_{start//5+1:03d}","title":f"Luyện giao tiếp từ mới {start//5+1:03d}",
                "topic":group[0]["topic"],"vocab":[v["word"] for v in group],"lines":lines,
                "source":SOURCE,"sourceVersion":VERSION
              })

          new_grammar=[]
          for start in range(0,NEED,25):
              group=new_vocab[start:start+25]
              new_grammar.append({
                "id":f"exp500v2_grammar_{start//25+1:02d}",
                "title":f"Ngữ pháp qua câu thật — {group[0]['topic']}",
                "level":"Beginner–Intermediate","formula":"Real sentence + target word in context",
                "explain":"Đọc câu thật, nghe câu và nói lại câu để ghi nhớ cách dùng trong ngữ cảnh.",
                "examples":[v["example"] for v in group],"notes":"Ví dụ câu từ Tatoeba.",
                "vocabWords":[v["word"] for v in group],"source":SOURCE,"sourceVersion":VERSION
              })

          final_vocab=vocab+new_vocab
          final_sentences=sentences+new_sentences
          final_questions=questions+new_questions
          final_tri=trilingual+new_tri
          final_comm=communication+new_comm
          final_grammar=grammar+new_grammar

          writej("vocabulary.json",final_vocab)
          writej("sentences.json",final_sentences)
          writej("questions.json",final_questions)
          writej("trilingual.json",final_tri)
          writej("communication.json",final_comm)
          writej("grammar.json",final_grammar)

          writej("expansion500_v2.json",{
            "package":SOURCE,"version":VERSION,"count":NEED,
            "attribution":"Example sentences from Tatoeba (tatoeba.org), CC BY 2.0 FR.",
            "words":[
              {"word":new_vocab[i]["word"],"vocabId":new_vocab[i]["id"],
               "sentenceId":new_sentences[i]["id"],"questionIds":[new_questions[i*2]["id"],new_questions[i*2+1]["id"]],
               "trilingualId":new_tri[i]["id"],"communicationId":new_comm[i//5]["id"],"grammarId":new_grammar[i//25]["id"]}
              for i in range(NEED)
            ]
          })

          writej("version.json",{
            "version":VERSION,"updatedAt":"2026-09-28",
            "releaseNotes":"V8.1.0: 500 từ mới, câu EN-VI lấy từ snapshot Tatoeba, IPA/nghĩa từ dữ liệu tĩnh, và liên kết nghe/đọc/nói/quiz/ôn tập/tam ngữ/giao tiếp/ngữ pháp.",
            "files":{"vocabulary":"vocabulary.json","sentences":"sentences.json","questions":"questions.json","grammar":"grammar.json","communication":"communication.json","trilingual":"trilingual.json"},
            "expansion":{"package":SOURCE,"count":NEED}
          })

          app=ROOT/"app.js"; txt=app.read_text(encoding="utf-8")
          txt=re.sub(r'^const APP_VERSION="[^"]+";',f'const APP_VERSION="{VERSION}";',txt,count=1,flags=re.M)
          app.write_text(txt,encoding="utf-8")
          (ROOT/"app-version.json").write_text(json.dumps({"version":VERSION,"updatedAt":"2026-09-28","reason":"verified 500-word V2 content"},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          idx=ROOT/"index.html"; s=idx.read_text(encoding="utf-8")
          s=re.sub(r'<meta name="application-version" content="[^"]+">',f'<meta name="application-version" content="{VERSION}">',s)
          s=re.sub(r'<title>English Master V[^<]+</title>',f'<title>English Master V{VERSION}</title>',s)
          s=re.sub(r'<script src="app\.js\?v=[^"]+"',f'<script src="app.js?v={VERSION}"',s)
          s=re.sub(r'<strong>English Master <small>V[^<]+</small>',f'<strong>English Master <small>V{VERSION}</small>',s)
          idx.write_text(s,encoding="utf-8")
          sw=ROOT/"sw.js"; s=sw.read_text(encoding="utf-8")
          s=re.sub(r'CACHE_NAME="[^"]+"',f'CACHE_NAME="english-master-v{VERSION}-layout-switch"',s,1)
          s=re.sub(r'app\.js\?v=[0-9.]+',f'app.js?v={VERSION}',s)
          sw.write_text(s,encoding="utf-8")
          manifest=ROOT/"manifest.json"; m=json.loads(manifest.read_text(encoding="utf-8")); m["name"]="English Master V"+VERSION
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Hard validation.
          assert len(new_vocab)==500 and len({norm(v["word"]) for v in new_vocab})==500
          assert all(v["ipa"] and v["meaning"] and v["example"] and v["exampleVi"] and v["audioEn"] for v in new_vocab)
          assert len(new_sentences)==500 and len({norm(s["en"]) for s in new_sentences})==500
          assert all(s["en"] and s["vi"] and s["audioEn"] and not s.get("vocabWord") for s in new_sentences)
          assert len(new_questions)==1000 and all(len(q["options"])==4 and len({norm(x) for x in q["options"]})==4 and q["options"][q["answer"]] for q in new_questions)
          assert len(new_tri)==500 and all(t["en"] and t["zh"] and t["pinyin"] and t["vi"] and t["audioEn"] and t["audioZh"] and t["audioVi"] for t in new_tri)
          assert len(new_comm)==100 and all(len(d["lines"])==20 for d in new_comm)
          assert len(new_grammar)==20 and all(len(g["examples"])==25 and len(g["vocabWords"])==25 for g in new_grammar)
          assert all(not any(rx.search(v["example"]) for rx in []) for v in new_vocab)
          print(json.dumps({"PASS":True,"newWords":500,"sentences":500,"questions":1000,"trilingual":500,"communication":100,"grammar":20},ensure_ascii=False))
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data app.js app-version.json index.html sw.js manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "V8.1.0: add 500 verified cross-feature words [data-build]"
          git push
