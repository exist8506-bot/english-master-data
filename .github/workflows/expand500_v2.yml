name: Build verified 500-word V2 package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: english-master-v2-build
  cancel-in-progress: true

jobs:
  build-v2:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'trigger 500-word package')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate 500-word package
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q cmudict
          python3 scripts/build-500-v2.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data app.js app-version.json index.html sw.js manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "V8.1.0: add 500 verified cross-feature words [data-build]"
          git push
