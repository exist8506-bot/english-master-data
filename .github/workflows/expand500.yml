name: Build 500 cross-feature vocabulary expansion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expand500.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate V8
        env:
          HSK_BASE: https://raw.githubusercontent.com/plaktos/hsk_csv/master
          DICT_DB_URL: https://raw.githubusercontent.com/chuongmep/vi-en-dictionary/main/vi_en_dict.db
          TTS_BASE: https://dict.minhqnd.com/api/v1/tts
        run: |
          set -e
          python3 -m pip install --disable-pip-version-check -q cmudict
          curl -L --fail --retry 3 --retry-delay 1 "$DICT_DB_URL" -o /tmp/vi_en_dict.db
          test -s /tmp/vi_en_dict.db
          python3 - <<'PY'
          import csv, html, json, os, re, sqlite3, urllib.parse, urllib.request
          from pathlib import Path

          ROOT = Path.cwd()
          DATA = ROOT / "data"
          VERSION = "8.0.0"
          NEED = 500
          HSK_BASE = os.environ["HSK_BASE"]
          DB_PATH = "/tmp/vi_en_dict.db"
          TTS_BASE = os.environ["TTS_BASE"]
          UA = "English-Master-V8-DataBuilder/2.0"

          def readj(name):
              with open(DATA / name, "r", encoding="utf-8") as f:
                  return json.load(f)

          def writej(name, obj):
              with open(DATA / name, "w", encoding="utf-8") as f:
                  json.dump(obj, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          def norm(s):
              return re.sub(r"\s+", " ", str(s or "").strip().lower())

          def hash_id(s):
              h = 2166136261
              for ch in str(s):
                  h ^= ord(ch)
                  h = (h * 16777619) & 0xffffffff
              return format(h, "x")

          def get_text(url, tries=3):
              last = None
              for attempt in range(1, tries + 1):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return r.read().decode("utf-8")
                  except Exception as e:
                      last = e
                      if attempt < tries:
                          import time
                          time.sleep(0.4 * attempt)
              raise last

          def parse_hsk(raw, level):
              out = []
              for row in csv.reader(raw.splitlines()):
                  if len(row) < 3:
                      continue
                  zh, py = row[0].strip(), row[1].strip()
                  raw_en = ",".join(row[2:]).strip()
                  word = re.sub(r"^to\s+", "", raw_en, flags=re.I)
                  word = re.sub(r"^(a|an)\s+", "", word, flags=re.I).strip().lower()
                  if zh and py and re.fullmatch(r"[a-z]+", word) and 3 <= len(word) <= 14:
                      out.append({"word":word,"zh":zh,"pinyin":py,"rawEn":raw_en,"hsk":level})
              return out

          def topic(word):
              groups = {
                  "school": ["school","student","teacher","class","lesson","exam","homework","college","university","study","education","knowledge","degree","library","research"],
                  "work": ["job","work","office","company","boss","manager","worker","meeting","business","career","project","report","salary","department","factory","customer"],
                  "travel": ["travel","trip","airport","station","train","bus","taxi","hotel","passport","flight","tour","journey","ticket","tourist","map","road"],
                  "food": ["food","meal","breakfast","lunch","dinner","restaurant","menu","bread","rice","noodle","soup","cake","fruit","vegetable","drink","taste"],
                  "health": ["health","doctor","hospital","medicine","exercise","ill","sick","fever","pain","body","heart","head","stomach","sleep"],
                  "home": ["home","house","room","kitchen","bathroom","door","window","table","chair","bed","family","parent","child","neighbor"],
                  "shopping": ["shop","shopping","buy","sell","price","cheap","expensive","market","store","clothes","shirt","shoe","size","discount"],
                  "technology": ["computer","phone","internet","email","screen","keyboard","software","technology","machine","online","website","video","camera"],
                  "weather": ["weather","rain","snow","wind","storm","cloud","sun","summer","winter","spring","autumn","temperature"],
                  "feelings": ["happy","sad","angry","afraid","worry","hope","love","hate","excited","tired","quiet","nervous","surprise","fear"],
                  "city": ["city","street","building","park","station","bridge","traffic","car","road","town","village","country"],
                  "nature": ["tree","flower","animal","river","mountain","forest","earth","land","sea","water","fire","air"],
                  "society": ["society","people","government","law","culture","history","community","public","social","country","world","language"]
              }
              w = word.lower()
              for k, vals in groups.items():
                  if any(v in w for v in vals):
                      return k
              return "daily"

          def dict_pos(raw):
              return str(raw or "").strip() or "word"

          # CMU ARPAbet -> readable IPA-like notation.
          IPA = {
              "AA":"ɑ","AE":"æ","AH":"ʌ","AO":"ɔ","AW":"aʊ","AY":"aɪ",
              "EH":"ɛ","ER":"ɝ","EY":"eɪ","IH":"ɪ","IY":"i",
              "OW":"oʊ","OY":"ɔɪ","UH":"ʊ","UW":"u",
              "B":"b","CH":"tʃ","D":"d","DH":"ð","F":"f","G":"ɡ","HH":"h",
              "JH":"dʒ","K":"k","L":"l","M":"m","N":"n","NG":"ŋ","P":"p",
              "R":"r","S":"s","SH":"ʃ","T":"t","TH":"θ","V":"v","W":"w",
              "Y":"j","Z":"z","ZH":"ʒ"
          }
          def cmu_ipa(word, cmu):
              pr = cmu.get(word.lower())
              if not pr:
                  return ""
              phones = pr[0]
              parts=[]
              primary=False
              for ph in phones:
                  m = re.fullmatch(r"([A-Z]+)([012]?)", ph)
                  if not m:
                      continue
                  base, stress = m.group(1), m.group(2)
                  val = IPA.get(base, "")
                  if not val:
                      continue
                  if stress == "1" and not primary:
                      parts.append("ˈ")
                      primary=True
                  elif stress == "2":
                      parts.append("ˌ")
                  parts.append(val)
              return "/" + "".join(parts) + "/"

          vocab = readj("vocabulary.json")
          sentences = readj("sentences.json")
          questions = readj("questions.json")
          grammar = readj("grammar.json")
          communication = readj("communication.json")
          trilingual = readj("trilingual.json")

          current = {norm(x.get("word")) for x in vocab}
          current |= {norm(x.get("en")) for x in trilingual}

          candidates = {}
          for level in (3,4,5,6):
              raw = get_text(f"{HSK_BASE}/hsk{level}.csv")
              for c in parse_hsk(raw, level):
                  if c["word"] not in current and c["word"] not in candidates:
                      candidates[c["word"]] = c
          ordered = sorted(candidates.values(), key=lambda x:(x["hsk"], x["word"]))

          cmu = None
          try:
              import cmudict
              cmu = cmudict.dict()
          except Exception:
              cmu = {}

          conn = sqlite3.connect(DB_PATH)
          cur = conn.cursor()
          found = {}
          for start in range(0, len(ordered), 450):
              batch = ordered[start:start+450]
              placeholders = ",".join("?" for _ in batch)
              words = [x["word"] for x in batch]
              cur.execute(
                  f"""SELECT lower(de.en), de.en, de.vi, de.pos, de.pronunciation,
                             dx.en_example, dx.vi_example
                      FROM dictionary_entries de
                      LEFT JOIN dictionary_examples dx
                        ON dx.entry_id=de.entry_id
                       AND dx.sort_order=1
                      WHERE lower(de.en) IN ({placeholders})""",
                  words
              )
              for row in cur.fetchall():
                  k = norm(row[0])
                  if k not in found:
                      found[k] = {
                          "en": row[1],
                          "vi": row[2],
                          "pos": row[3],
                          "pronunciation": row[4],
                          "example": row[5],
                          "exampleVi": row[6]
                      }
          conn.close()

          chosen=[]
          used=set(current)
          for c in ordered:
              d=found.get(c["word"])
              if not d:
                  continue
              example=str(d.get("example") or "").strip()
              example_vi=str(d.get("exampleVi") or "").strip()
              meaning=str(d.get("vi") or "").strip()
              if not (meaning and example and example_vi):
                  continue
              if not re.search(r"\b"+re.escape(c["word"])+r"\b", example, re.I):
                  continue
              if c["word"] in used:
                  continue
              ipa=cmu_ipa(c["word"],cmu)
              if not ipa:
                  p=str(d.get("pronunciation") or "").strip()
                  ipa=("/"+p.strip("/ ")+"/") if p else ""
              if not ipa:
                  continue
              used.add(c["word"])
              chosen.append({**c,**d,"ipa":ipa})
              if len(chosen)==NEED:
                  break

          assert len(chosen)==NEED, "only %d complete new HSK words found" % len(chosen)

          def tts(text,lang):
              return TTS_BASE+"?word="+urllib.parse.quote(str(text))+"&lang="+lang

          new_vocab=[]
          new_sentences=[]
          new_questions=[]
          new_tri=[]

          for i,x in enumerate(chosen,1):
              tp=topic(x["word"])
              level="Beginner" if x["hsk"]==3 else ("Intermediate" if x["hsk"]==4 else "Upper-Intermediate")
              vid=f"exp500_{i:03d}_{hash_id(x['word'])}"
              sid=f"exp500_sent_{i:03d}_{hash_id(x['word'])}"
              qid=f"exp500_q_{i:03d}_{hash_id(x['word'])}"
              tid=f"exp500_tri_{i:03d}_{hash_id(x['word'])}"

              v={
                  "id":vid,"word":x["word"],"ipa":x["ipa"],"meaning":x["vi"],
                  "pos":dict_pos(x["pos"]),"example":x["example"],"exampleVi":x["exampleVi"],
                  "synonyms":"","antonyms":"","topic":tp,"level":level,
                  "favorite":False,"status":"New","reviewDue":None,
                  "createdAt":"2026-09-25T00:00:00.000Z","audio":"tts",
                  "audioEn":tts(x["word"],"en"),
                  "source":"expansion500","sourceVersion":VERSION
              }
              s={
                  "id":sid,"en":x["example"],"vi":x["exampleVi"],"topic":tp,
                  "grammar":"Vocabulary in context","vocabWord":x["word"],
                  "audioEn":tts(x["example"],"en"),"favorite":False,
                  "source":"expansion500","sourceVersion":VERSION
              }
              tri={
                  "id":tid,"en":x["word"],"zh":x["zh"],"pinyin":x["pinyin"],
                  "vi":x["vi"],"topic":tp,"level":level,"audio":"tts",
                  "audioEn":tts(x["word"],"en"),"audioZh":tts(x["zh"],"zh"),
                  "audioVi":tts(x["vi"],"vi"),"source":"expansion500",
                  "sourceVersion":VERSION
              }
              new_vocab.append(v);new_sentences.append(s);new_tri.append(tri)

          pool=[v["meaning"] for v in new_vocab]
          for i,v in enumerate(new_vocab,1):
              choices=[]
              for off in (41,97,173,251,313):
                  m=pool[(i-1+off)%len(pool)]
                  if norm(m)!=norm(v["meaning"]) and norm(m) not in {norm(z) for z in choices}:
                      choices.append(m)
                  if len(choices)==3:
                      break
              opts=[v["meaning"]]+choices
              assert len(opts)==4 and len({norm(z) for z in opts})==4
              shift=(i*7)%4
              opts=opts[shift:]+opts[:shift]
              new_questions.append({
                  "id":f"exp500_q_{i:03d}_{hash_id(v['word'])}",
                  "type":"multiple",
                  "prompt":f'"{v["word"]}" nghĩa là gì?',
                  "options":opts,
                  "answer":opts.index(v["meaning"]),
                  "explain":f'{v["word"]} = {v["meaning"]}.',
                  "topic":v["topic"],"level":v["level"],"vocabWord":v["word"],
                  "audio":"tts","audioEn":tts(v["word"],"en"),
                  "source":"expansion500","sourceVersion":VERSION
              })

          new_comm=[]
          templates=[
              'What does "{w}" mean in everyday English?',
              'How can I use "{w}" in a sentence?',
              'Can you give me an example with "{w}"?',
              'Where might I see the word "{w}"?',
              'How would you use "{w}" in daily conversation?'
          ]
          for start in range(0,NEED,5):
              group=new_vocab[start:start+5]
              idx=start//5+1
              lines=[]
              for j,v in enumerate(group):
                  q=templates[j%5].format(w=v["word"])
                  lines.append(["A",q,'Từ "'+v["word"]+'" được dùng thế nào?'])
                  lines.append(["B",v["example"],v["exampleVi"]])
              new_comm.append({
                  "id":f"exp500_comm_{idx:03d}",
                  "title":f"Luyện giao tiếp {idx:02d} — {group[0]['topic']}",
                  "topic":group[0]["topic"],
                  "vocab":[v["word"] for v in group],
                  "lines":lines,
                  "source":"expansion500","sourceVersion":VERSION
              })

          new_grammar=[]
          for start in range(0,NEED,25):
              group=new_vocab[start:start+25]
              idx=start//25+1
              new_grammar.append({
                  "id":f"exp500_grammar_{idx:02d}",
                  "title":f"Ngữ pháp & dùng từ — {group[0]['topic']}",
                  "level":"Beginner–Intermediate",
                  "formula":"Vocabulary in context",
                  "explain":"Đọc câu ví dụ, nghe và chú ý cách từ mới được dùng trong ngữ cảnh.",
                  "examples":[v["example"] for v in group],
                  "notes":"Gói 500 từ mới V8.0.0.",
                  "vocabWords":[v["word"] for v in group],
                  "source":"expansion500","sourceVersion":VERSION
              })

          writej("vocabulary.json",vocab+new_vocab)
          writej("sentences.json",sentences+new_sentences)
          writej("questions.json",questions+new_questions)
          writej("trilingual.json",trilingual+new_tri)
          writej("communication.json",communication+new_comm)
          writej("grammar.json",grammar+new_grammar)
          writej("expansion500.json",{
              "package":"expansion500","version":VERSION,"count":NEED,
              "words":[
                  {"word":new_vocab[i]["word"],"vocabId":new_vocab[i]["id"],
                   "sentenceId":new_sentences[i]["id"],"questionId":new_questions[i]["id"],
                   "trilingualId":new_tri[i]["id"],"communicationId":new_comm[i//5]["id"],
                   "grammarId":new_grammar[i//25]["id"]}
                  for i in range(NEED)
              ]
          })

          (DATA/"ATTRIBUTION.md").write_text(
              "# Data attribution\n\n"
              "V8.0.0 sources:\n"
              "- HSK word lists: https://github.com/plaktos/hsk_csv\n"
              "- English-Vietnamese dictionary entries and paired examples: https://github.com/chuongmep/vi-en-dictionary\n"
              "- Runtime TTS audio URLs: https://dict.minhqnd.com/\n\n"
              "The 500-word package is stored as additive expansion500 records and cross-linked into sentences, questions, trilingual, communication and grammar practice. Existing app data and user progress are preserved.\n",
              encoding="utf-8"
          )

          writej("version.json",{
              "version":VERSION,"updatedAt":"2026-09-25",
              "releaseNotes":"V8.0.0: thêm đúng 500 từ mới; mỗi từ có nghĩa, phát âm, câu Anh-Việt, audio TTS và liên kết vào học từ, flashcards, đọc-hiểu, nghe, nói, quiz, ôn tập, tam ngữ, giao tiếp, ngữ pháp.",
              "files":{"vocabulary":"vocabulary.json","sentences":"sentences.json","questions":"questions.json","grammar":"grammar.json","communication":"communication.json","trilingual":"trilingual.json"},
              "expansion":{"package":"expansion500","count":500}
          })

          app= (ROOT/"app.js").read_text(encoding="utf-8")
          app=re.sub(r'const APP_VERSION="[^"]+";', f'const APP_VERSION="{VERSION}";', app, count=1)
          app=app.replace("English Master V7.0.6","English Master V8.0.0")
          if "function dataAudit()" not in app:
              app += '''
          function dataAudit(){
            const exp=db.vocab.filter(v=>v.source==="expansion500"&&v.sourceVersion==="8.0.0");
            const N=s=>new Set((s||[]).filter(Boolean).map(norm));
            const sw=N(db.sentences.map(x=>x.vocabWord)),qw=N(db.questions.map(x=>x.vocabWord));
            const tw=N(db.trilingual.map(x=>x.en)),cw=N(db.communication.flatMap(x=>x.vocab||[]));
            const gw=N(db.grammar.flatMap(x=>x.vocabWords||[]));
            const result={
              expansion500:exp.length,
              duplicateWords:exp.length-new Set(exp.map(x=>norm(x.word))).size,
              sentences:exp.filter(x=>sw.has(norm(x.word))).length,
              questions:exp.filter(x=>qw.has(norm(x.word))).length,
              trilingual:exp.filter(x=>tw.has(norm(x.word))).length,
              communication:exp.filter(x=>cw.has(norm(x.word))).length,
              grammar:exp.filter(x=>gw.has(norm(x.word))).length,
              audio:exp.filter(x=>x.audio==="tts"&&x.audioEn).length
            };
            console.table(result); return result;
          }
          '''
          (ROOT/"app.js").write_text(app,encoding="utf-8")

          index=(ROOT/"index.html").read_text(encoding="utf-8")
          index=re.sub(r'application-version" content="[^"]+"', f'application-version" content="{VERSION}"', index, count=1)
          index=re.sub(r'<title>English Master[^<]*</title>', f'<title>English Master V{VERSION}</title>', index, count=1)
          (ROOT/"index.html").write_text(index,encoding="utf-8")

          sw=(ROOT/"sw.js").read_text(encoding="utf-8")
          sw=re.sub(r'english-master-v[^"]+',f'english-master-v{VERSION}',sw,count=1)
          (ROOT/"sw.js").write_text(sw,encoding="utf-8")

          FV,FS,FQ,FT,FC,FG=[readj(n) for n in ["vocabulary.json","sentences.json","questions.json","trilingual.json","communication.json","grammar.json"]]
          exp=[x for x in FV if x.get("source")=="expansion500" and x.get("sourceVersion")==VERSION]
          assert len(exp)==500
          assert len({norm(x["word"]) for x in exp})==500
          assert all(x.get("ipa") and x.get("meaning") and x.get("example") and x.get("exampleVi") for x in exp)
          assert all(x.get("audioEn") for x in exp)

          ss={norm(x.get("vocabWord")) for x in FS if x.get("vocabWord")}
          qs={norm(x.get("vocabWord")) for x in FQ if x.get("vocabWord")}
          ts={norm(x.get("en")) for x in FT if x.get("en")}
          cs={norm(w) for d in FC for w in d.get("vocab",[])}
          gs={norm(w) for d in FG for w in d.get("vocabWords",[])}

          for x in exp:
              k=norm(x["word"])
              assert k in ss and k in qs and k in ts and k in cs and k in gs, x["word"]

          for q in FQ:
              if q.get("source")=="expansion500":
                  assert len(q["options"])==4 and len({norm(v) for v in q["options"]})==4
                  assert 0<=q["answer"]<4 and q["options"][q["answer"]]==next(v["meaning"] for v in new_vocab if norm(v["word"])==norm(q["vocabWord"]))

          assert sum(x.get("source")=="expansion500" for x in FS)==500
          assert sum(x.get("source")=="expansion500" for x in FQ)==500
          assert sum(x.get("source")=="expansion500" for x in FT)==500
          assert sum(str(x.get("id","")).startswith("exp500_comm_") for x in FC)==100
          assert sum(x.get("source")=="expansion500" for x in FG)==20
          assert len(readj("expansion500.json")["words"])==500

          app_text=(ROOT/"app.js").read_text(encoding="utf-8")
          idx_text=(ROOT/"index.html").read_text(encoding="utf-8")
          sw_text=(ROOT/"sw.js").read_text(encoding="utf-8")
          assert f'const APP_VERSION="{VERSION}";' in app_text
          assert "function dataAudit()" in app_text
          assert f'content="{VERSION}"' in idx_text
          assert f"english-master-v{VERSION}" in sw_text

          print(json.dumps({
              "status":"PASS","added":500,
              "totals":{"vocabulary":len(FV),"sentences":len(FS),"questions":len(FQ),
                        "trilingual":len(FT),"communication":len(FC),"grammar":len(FG)},
              "links":{"sentences":500,"questions":500,"trilingual":500,"communication":500,"grammar":500},
              "audio":500,"quizUnique":"500/500 x 4 unique options","version":VERSION
          },ensure_ascii=False,indent=2))
          PY

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js data
          git rm -f scripts/expand500.js.gz 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "V8.0.0: add 500 cross-feature vocabulary [data-build]"
          git push
