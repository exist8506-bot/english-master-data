name: Build 500 cross-feature vocabulary expansion
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expand500.yml"
      - "scripts/expand500.js.gz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack builder
        run: gunzip -c scripts/expand500.js.gz > scripts/expand500.js
      - name: Generate, validate and test
        run: node scripts/expand500.js
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js data
          git diff --cached --quiet && exit 0
          git commit -m "V8.0.0: add 500 cross-feature vocabulary [data-build]"
          git push
