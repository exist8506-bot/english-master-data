name: English Master - V9.3.0 Logic Hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-v9.3.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'V9.3.0:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V9.3.0 fixes
        shell: python
        run: |
          from pathlib import Path

          VERSION = "9.3.0"

          def replace_exact(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"Expected text not found in {path}: {old[:160]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          # Version signals.
          replace_exact("app.js", 'const APP_VERSION="9.2.0";', f'const APP_VERSION="{VERSION}";')
          replace_exact("index.html", 'content="9.2.0"', f'content="{VERSION}"')
          replace_exact("index.html", '<title>English Master V9.2.0</title>', f'<title>English Master V{VERSION}</title>')
          replace_exact("index.html", '<small>V9.2.0</small>', f'<small>V{VERSION}</small>')
          replace_exact("index.html", 'app.js?v=9.2.0', f'app.js?v={VERSION}')
          replace_exact("manifest.json", '"English Master V9.2.0"', f'"English Master V{VERSION}"')
          replace_exact("sw.js", 'CACHE_NAME="english-master-v9.2.0"', f'CACHE_NAME="english-master-v{VERSION}"')
          replace_exact("sw.js", './app.js?v=9.2.0', f'./app.js?v={VERSION}')
          replace_exact("app-version.json", '"version": "9.2.0"', f'"version": "{VERSION}"')

          app = Path("app.js").read_text(encoding="utf-8")

          # 1) Listening: make scoring idempotent against rapid/double taps.
          replace_exact(
              "app.js",
              'let activeRecognition=null,recognitionToken=0,listenAdvanceTimer=0;',
              'let activeRecognition=null,recognitionToken=0,listenAdvanceTimer=0,listenAnswered=false;'
          )
          replace_exact(
              "app.js",
              'function renderListening(){\n  const list=sentencePracticePool();',
              'function renderListening(){\n  listenAnswered=false;\n  const list=sentencePracticePool();'
          )
          old = '''function listenCheck(el,selected,correct){
            stopSpeech();
            document.querySelectorAll(".option").forEach(function(b){b.disabled=true});'''
          new = '''function listenCheck(el,selected,correct){
            if(listenAnswered)return;
            if(!el||!String(correct??"").trim()){toast("Câu nghe không hợp lệ.");return}
            listenAnswered=true;
            stopSpeech();
            document.querySelectorAll(".option").forEach(function(b){b.disabled=true});'''
          if old not in app:
              raise SystemExit("Expected listenCheck block not found")
          app = app.replace(old, new, 1)
          replace_exact(
              "app.js",
              '    listenIndex=(listenIndex+1)%list.length;window.__showListeningText=false;save();renderListening();',
              '    listenIndex=(listenIndex+1)%list.length;window.__showListeningText=false;save();renderListening();'
          )
          # Explicitly reset the one-shot guard whenever the learner jumps to another item.
          replace_exact(
              "app.js",
              '    window.__showListeningText=false;\n    listenIndex=n-1;',
              '    window.__showListeningText=false;\n    listenAnswered=false;\n    listenIndex=n-1;'
          )

          # 2) Practice: reject malformed option indices instead of scoring a fabricated answer.
          old = '''function practiceAnswer(index){
            if(practiceAnswered)return;
            const item=practiceQueue[practiceIndex];if(!item||item.type==="order")return;
            const choice=String(item.options[index]??"");'''
          new = '''function practiceAnswer(index){
            if(practiceAnswered)return;
            const item=practiceQueue[practiceIndex];if(!item||item.type==="order")return;
            const choiceIndex=Number(index);
            if(!Number.isInteger(choiceIndex)||choiceIndex<0||choiceIndex>=item.options.length){toast("Đáp án không hợp lệ.");return}
            const choice=String(item.options[choiceIndex]??"");'''
          if old not in app:
              raise SystemExit("Expected practiceAnswer block not found")
          app = app.replace(old, new, 1)
          replace_exact("app.js", 'practiceAnswered=true;finishPractice(ok);if(item.word)recordVocabOutcome(item.word,ok);', 'practiceAnswered=true;finishPractice(ok);if(item.word)recordVocabOutcome(item.word,ok);')
          replace_exact(
              "app.js",
              'document.querySelectorAll(".option").forEach(function(b,i){b.disabled=true;if(i===correctIndex)b.classList.add("correct");if(i===index&&!ok)b.classList.add("wrong");});',
              'document.querySelectorAll(".option").forEach(function(b,i){b.disabled=true;if(i===correctIndex)b.classList.add("correct");if(i===choiceIndex&&!ok)b.classList.add("wrong");});'
          )

          # 3) Quiz: never fall back to an untrusted handler argument for the correct index.
          old = '  const correctIndex=Number.isInteger(quizCorrectIndex)&&quizCorrectIndex>=0?quizCorrectIndex:Number(a);\n  quizAnswered=true;'
          new = '  if(!Number.isInteger(quizCorrectIndex)||quizCorrectIndex<0||quizCorrectIndex>=quizOptions.length){toast("Câu hỏi chưa sẵn sàng.");return}\n  const correctIndex=quizCorrectIndex;\n  quizAnswered=true;'
          if old not in app:
              raise SystemExit("Expected quiz correct-index fallback not found")
          app = app.replace(old, new, 1)

          # 4) Daily goal: changing today's goal immediately updates today's history row.
          marker = 'function dailyGoal(){const n=Number(db.profile.dailyGoal);return Number.isFinite(n)?Math.max(1,Math.min(100,Math.floor(n))):10;}'
          if marker not in app:
              raise SystemExit("Expected dailyGoal marker not found")
          helper = '''function setDailyGoal(value){
            const n=Number(value);
            if(!Number.isInteger(n)||n<1||n>100){toast("Mục tiêu ngày không hợp lệ.");return}
            ensureDailyProgress();
            db.profile.dailyGoal=n;
            syncDailyHistoryEntry();
            save();
            render();
          }
          '''
          app = app.replace(marker, helper + marker, 1)

          replace_exact(
              "app.js",
              '<select onchange="db.profile.dailyGoal=Number(this.value);save();render()">',
              '<select onchange="setDailyGoal(this.value)">'
          )

          # Visible V9.3 labels.
          app = app.replace('Tiến độ V9.2","Mục tiêu ngày', 'Tiến độ V9.3","Mục tiêu ngày')
          app = app.replace('Luyện tập V9.2","Chế độ:', 'Luyện tập V9.3","Chế độ:')
          app = app.replace('shell("Luyện tập V9.2"', 'shell("Luyện tập V9.3"', 1)

          # Persist the modified app.
          Path("app.js").write_text(app, encoding="utf-8")

          # Extend runtime QA.
          qa_path = Path("scripts/qa-runtime-smoke.mjs")
          qa = qa_path.read_text(encoding="utf-8")
          qa = qa.replace('expectedAppVersion==="9.2.0"', 'expectedAppVersion==="9.3.0"', 1)
          qa = qa.replace('reviewSession: {...reviewSession}', 'reviewSession: {...reviewSession}, listenAnswered', 1)

          anchor = 'const sentenceAnsweredBefore = T.snap().db.stats.sentenceAnswered || 0;'
          insert = '''const sentenceAnsweredBefore = T.snap().db.stats.sentenceAnswered || 0;
          const sentenceCorrectBefore = T.snap().db.stats.sentenceCorrect || 0;
          if (currentSentence) {
            const listenButton = new El("listen-option-idempotent", "button");
            T.listenCheck(listenButton, currentSentence.vi, currentSentence.vi);
            T.listenCheck(listenButton, currentSentence.vi, currentSentence.vi);
          }
          const afterDoubleListen = T.snap().db.stats;
          check("listening double-tap is scored only once", afterDoubleListen.sentenceAnswered === sentenceAnsweredBefore + 1 && afterDoubleListen.sentenceCorrect === sentenceCorrectBefore + 1 && T.snap().listenAnswered === true);
          T.show("listening");'''
          # Use only the first matching anchor, then keep the existing interaction test below.
          if anchor not in qa:
              raise SystemExit("Expected listening QA anchor not found")
          qa = qa.replace(anchor, insert, 1)

          anchor2 = 'T.show("practice");'
          insert2 = '''T.show("practice");
          const invalidPracticeBefore = T.snap().practiceAnsweredCount;
          T.practiceAnswer(999);
          check("invalid practice choice is ignored", T.snap().practiceAnsweredCount === invalidPracticeBefore && T.snap().practiceAnswered === false);
          '''
          # Insert before the later practice reset block by replacing the last occurrence.
          pos = qa.rfind(anchor2)
          if pos < 0:
              raise SystemExit("Expected practice QA anchor not found")
          qa = qa[:pos] + insert2 + qa[pos+len(anchor2):]

          anchor3 = 'T.applyUserSnapshot(beforeReset.db);'
          insert3 = '''T.setDailyGoal(20);
          const goalToday = T.snap().db.stats.dailyHistory.find(x => x.date === T.snap().db.stats.dailyDate);
          check("daily goal change updates today's history", T.snap().db.profile.dailyGoal === 20 && goalToday?.goal === 20);
          T.applyUserSnapshot(beforeReset.db);'''
          if anchor3 not in qa:
              raise SystemExit("Expected reset restore QA anchor not found")
          qa = qa.replace(anchor3, insert3, 1)

          anchor4 = 'const quizPromptButton ='
          if anchor4 not in qa:
              raise SystemExit("Expected quiz QA section not found")
          # Existing invalid-choice test already covers bounds; add an invalid internal correct index regression.
          insert4 = '''const savedQuizCorrectIndex = T.snap().quizCorrectIndex;
          T.snap().quizCorrectIndex = -1;
          const quizAnsweredBeforeInvalidCorrect = T.snap().db.stats.answered;
          T.answerQuiz(0, 0);
          check("quiz rejects missing internal correct index", T.snap().db.stats.answered === quizAnsweredBeforeInvalidCorrect);
          T.snap().quizCorrectIndex = savedQuizCorrectIndex;
          '''
          qa = qa.replace(anchor4, insert4 + anchor4, 1)

          qa_path.write_text(qa, encoding="utf-8")

          readme = Path("README.md").read_text(encoding="utf-8")
          if "## V9.3.0" not in readme:
              readme += "\n## V9.3.0\n- Logic hardening for listening double-tap scoring, malformed practice/quiz input, and daily-goal history synchronization.\n"
              Path("README.md").write_text(readme, encoding="utf-8")

          Path("app-version.json").write_text(
              '{\n  "version": "9.3.0",\n  "updatedAt": "2026-10-01"\n}\n',
              encoding="utf-8"
          )

      - name: Syntax checks
        run: |
          node --check app.js
          node --check scripts/qa-runtime-smoke.mjs

      - name: Commit and push
        run: |
          git config user.name "exist8506-bot"
          git config user.email "exist8506@gmail.com"
          git add app.js index.html manifest.json sw.js app-version.json README.md scripts/qa-runtime-smoke.mjs
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "V9.3.0: harden learning interaction logic"
          git push origin main
