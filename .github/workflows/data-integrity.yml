name: English Master - Data Integrity Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Data preservation audit
        run: node scripts/qa-preserve-main.mjs

      - name: Data integrity audit
        run: node scripts/qa-data-integrity.mjs
