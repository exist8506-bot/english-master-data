name: English Master - Data Integrity Guard

on:
  push:
    branches:
      - main
      - qa/data-preservation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check scripts/qa-data-integrity.mjs
          node --check scripts/qa-preserve-main.mjs
          node --check scripts/qa-chaos-data-protection.mjs
          node --check scripts/qa-chaos-data-protection-2.mjs
          node --check scripts/qa-runtime-smoke.mjs
          node --check scripts/qa-semantic-audit.mjs
          node --check scripts/repair-standalone-sentences.mjs

      - name: Data preservation audit
        run: node scripts/qa-preserve-main.mjs

      - name: Data integrity audit
        run: node scripts/qa-data-integrity.mjs

      - name: First-wave chaos audit
        run: node scripts/qa-chaos-data-protection.mjs

      - name: Second-wave chaos audit
        run: node scripts/qa-chaos-data-protection-2.mjs

      - name: Runtime smoke audit
        run: node scripts/qa-runtime-smoke.mjs

      - name: Semantic sentence audit
        run: node scripts/qa-semantic-audit.mjs

      - name: Repair known standalone sentence defects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/repair-standalone-sentences.mjs

      - name: Commit standalone sentence repairs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/sentences.json; then
            echo "No sentence repair changes."
            exit 0
          fi
          git config user.name "English Master Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sentences.json
          git commit -m "fix: replace remaining unnatural standalone sentences"
          git push origin HEAD:main
