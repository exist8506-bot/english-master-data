name: English Master - V9.2.0 Stability Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-v9.2.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'V9.2.0:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V9.2.0 stability fixes
        shell: python
        run: |
          from pathlib import Path

          VERSION = "9.2.0"

          def replace_exact(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          # Version signals
          replace_exact("app.js", 'const APP_VERSION="9.1.6";', f'const APP_VERSION="{VERSION}";')
          replace_exact("index.html", 'content="9.1.6"', f'content="{VERSION}"')
          replace_exact("index.html", '<title>English Master V9.1.6</title>', f'<title>English Master V{VERSION}</title>')
          replace_exact("index.html", '<small>V9.1.6</small>', f'<small>V{VERSION}</small>')
          replace_exact("index.html", 'app.js?v=9.1.6', f'app.js?v={VERSION}')
          replace_exact("manifest.json", '"English Master V9.1.6"', f'"English Master V{VERSION}"')
          replace_exact("sw.js", 'CACHE_NAME="english-master-v9.1.6"', f'CACHE_NAME="english-master-v{VERSION}"')
          replace_exact("sw.js", './app.js?v=9.1.6', f'./app.js?v={VERSION}')
          replace_exact("app-version.json", '"version": "9.1.6"', f'"version": "{VERSION}"')
          replace_exact("README.md", 'English Master', 'English Master',) if False else None

          app = Path("app.js").read_text(encoding="utf-8")

          # V9.2: robust speech matching for common contractions and punctuation.
          old = '''function similarityScore(a,b){
            const A=norm(a).replace(/[.!?,]/g,"").split(" ").filter(Boolean),B=norm(b).replace(/[.!?,]/g,"").split(" ").filter(Boolean);
            if(!A.length||!B.length)return 0;let hit=0;const used=new Set();
            A.forEach(function(x){const i=B.findIndex(function(y,j){return !used.has(j)&&x===y});if(i>=0){hit++;used.add(i)}});return Math.round(hit/Math.max(A.length,B.length)*100);
          }'''
          new = '''function normalizeSpeechText(s){
            let t=norm(s).replace(/’/g,"'");
            t=t
              .replace(/\\b(i'm|im)\\b/g,"i am")
              .replace(/\\b(you're|youre)\\b/g,"you are")
              .replace(/\\b(we're|were)\\b/g,"we are")
              .replace(/\\b(they're|theyre)\\b/g,"they are")
              .replace(/\\b(it's|its)\\b/g,"it is")
              .replace(/\\b(can't|cant)\\b/g,"cannot")
              .replace(/\\b(won't|wont)\\b/g,"will not")
              .replace(/\\b(don't|dont)\\b/g,"do not")
              .replace(/\\b(doesn't|doesnt)\\b/g,"does not")
              .replace(/\\b(didn't|didnt)\\b/g,"did not")
              .replace(/\\b(isn't|isnt)\\b/g,"is not")
              .replace(/\\b(aren't|arent)\\b/g,"are not")
              .replace(/\\b(wasn't|wasnt)\\b/g,"was not")
              .replace(/\\b(weren't|werent)\\b/g,"were not")
              .replace(/\\b(i'll|ill)\\b/g,"i will")
              .replace(/\\b(you'll|youll)\\b/g,"you will")
              .replace(/\\b(we'll|well)\\b/g,"we will")
              .replace(/\\b(they'll|theyll)\\b/g,"they will")
              .replace(/\\b(i'd|id)\\b/g,"i would")
              .replace(/\\b(you'd|youd)\\b/g,"you would")
              .replace(/\\b(we'd|wed)\\b/g,"we would")
              .replace(/\\b(they'd|theyd)\\b/g,"they would");
            return t.replace(/[.!?,;:()[\\]{}"]/g," ").replace(/\\s+/g," ").trim();
          }
          function similarityScore(a,b){
            const A=normalizeSpeechText(a).split(" ").filter(Boolean),B=normalizeSpeechText(b).split(" ").filter(Boolean);
            if(!A.length||!B.length)return 0;let hit=0;const used=new Set();
            A.forEach(function(x){const i=B.findIndex(function(y,j){return !used.has(j)&&x===y});if(i>=0){hit++;used.add(i)}});
            return Math.round(hit/Math.max(A.length,B.length)*100);
          }'''
          if old not in app:
              raise SystemExit("Expected similarityScore block not found")
          app = app.replace(old, new, 1)

          # V9.2: prevent duplicate SpeechRecognition scoring when browsers emit multiple final results.
          old = 'const list=sentencePracticePool();if(!list.length){toast("Chưa có câu luyện độc lập.");return}\n  speakIndex=normalizeArrayIndex(speakIndex,list.length);'
          new = 'const list=sentencePracticePool();if(!list.length){toast("Chưa có câu luyện độc lập.");return}\n  speakIndex=normalizeArrayIndex(speakIndex,list.length);'
          if old not in app:
              raise SystemExit("Expected startRecognition setup not found")
          app = app.replace(old, new, 1)
          old = 'const target=list[speakIndex].en,r=new SR(),token=++recognitionToken;'
          new = 'const target=list[speakIndex].en,r=new SR(),token=++recognitionToken;let handledResult=false;'
          if old not in app:
              raise SystemExit("Expected recognition token block not found")
          app = app.replace(old, new, 1)
          old = 'r.onresult=function(e){\n    if(token!==recognitionToken||activeRecognition!==r)return;'
          new = 'r.onresult=function(e){\n    if(handledResult)return;if(token!==recognitionToken||activeRecognition!==r)return;\n    handledResult=true;'
          if old not in app:
              raise SystemExit("Expected recognition onresult block not found")
          app = app.replace(old, new, 1)

          # V9.2: reject malformed quiz answer indices instead of scoring a fabricated wrong answer.
          old = 'function answerQuiz(i,a){\n  if(quizAnswered)return;\n  stopSpeech();'
          new = '''function answerQuiz(i,a){
            if(quizAnswered)return;
            const choiceIndex=Number.isInteger(Number(i))?Number(i):-1;
            if(choiceIndex<0||choiceIndex>=quizOptions.length){toast("Đáp án không hợp lệ.");return}
            stopSpeech();'''
          if old not in app:
              raise SystemExit("Expected answerQuiz header not found")
          app = app.replace(old, new, 1)
          old = 'const ok=i===correctIndex;'
          new = 'const ok=choiceIndex===correctIndex;'
          if old not in app:
              raise SystemExit("Expected quiz comparison not found")
          app = app.replace(old, new, 1)
          old = 'if(j===i&&!ok)b.classList.add("wrong")'
          new = 'if(j===choiceIndex&&!ok)b.classList.add("wrong")'
          if old not in app:
              raise SystemExit("Expected quiz wrong-choice highlight not found")
          app = app.replace(old, new, 1)

          # V9.2: persist learning state when the page is backgrounded/closed.
          marker = 'function registerServiceWorker(){'
          if 'function persistLifecycle()' not in app:
              helper = '''function persistLifecycle(){
            try{save();}catch(e){}
          }
          function installLifecyclePersistence(){
            try{
              document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")persistLifecycle()});
              window.addEventListener("pagehide",persistLifecycle);
            }catch(e){}
          }
          '''
              if marker not in app:
                  raise SystemExit("Expected lifecycle insertion marker not found")
              app = app.replace(marker, helper + marker, 1)
          old = '  checkAppVersion();\n}'
          new = '  checkAppVersion();\n  installLifecyclePersistence();\n}'
          if old not in app:
              raise SystemExit("Expected init tail not found")
          app = app.replace(old, new, 1)

          # Visible V9.2 labels.
          app = app.replace('Tiến độ V9","Mục tiêu ngày', 'Tiến độ V9.2","Mục tiêu ngày')
          app = app.replace('Luyện tập V9","Chế độ:', 'Luyện tập V9.2","Chế độ:')
          app = app.replace('shell("Luyện tập V9"', 'shell("Luyện tập V9.2"', 1)

          Path("app.js").write_text(app, encoding="utf-8")

          # Runtime smoke: align version signal and add focused regression checks.
          qa_path = Path("scripts/qa-runtime-smoke.mjs")
          qa = qa_path.read_text(encoding="utf-8")
          qa = qa.replace('expectedAppVersion==="9.1.6"', 'expectedAppVersion==="9.2.0"', 1)
          qa = qa.replace('app.js parses", true', 'app.js parses", true', 1)
          anchor = 'check("similarity score empty input is 0", T.similarityScore("", "hello") === 0);'
          insert = anchor + '\ncheck("speech similarity normalizes common contractions", T.similarityScore("I\'m ready!", "I am ready.") >= 90);'
          if anchor not in qa:
              raise SystemExit("Expected similarity QA anchor not found")
          qa = qa.replace(anchor, insert, 1)
          anchor2 = 'const quizPromptButton = (document.getElementById("view").innerHTML.match(/<button[^>]*>🔊 Đọc câu hỏi<\\/button>/) || [])[0] || "";'
          insert2 = '''T.show("quiz");
          const invalidQuizAnswerBefore = T.snap().db.stats.answered;
          const invalidQuizIndexBefore = T.snap().quizIndex;
          T.answerQuiz(999, T.snap().quizCorrectIndex);
          check("invalid quiz choice is ignored", T.snap().db.stats.answered === invalidQuizAnswerBefore && T.snap().quizIndex === invalidQuizIndexBefore);
          ''' + anchor2
          if anchor2 not in qa:
              raise SystemExit("Expected quiz QA anchor not found")
          qa = qa.replace(anchor2, insert2, 1)
          qa_path.write_text(qa, encoding="utf-8")

          # Documentation version marker.
          readme = Path("README.md").read_text(encoding="utf-8")
          if "## V9.2.0" not in readme:
              readme += "\n## V9.2.0\n- Stability hardening for speech recognition, quiz input validation, and lifecycle progress persistence.\n"
              Path("README.md").write_text(readme, encoding="utf-8")

          Path("app-version.json").write_text(
              '{\n  "version": "9.2.0",\n  "updatedAt": "2026-10-01"\n}\n',
              encoding="utf-8"
          )

      - name: Syntax check patched files
        run: |
          node --check app.js
          node --check scripts/qa-runtime-smoke.mjs

      - name: Commit and push
        run: |
          git config user.name "exist8506-bot"
          git config user.email "exist8506@gmail.com"
          git add app.js index.html manifest.json sw.js app-version.json README.md scripts/qa-runtime-smoke.mjs
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "V9.2.0: stability hardening and regression fixes"
          git push origin main
