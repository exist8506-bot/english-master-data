name: Package English Master Download

on:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add local launcher and instructions
        shell: bash
        run: |
          cat > RUN_LOCAL.bat <<'EOF'
          @echo off
          cd /d "%~dp0"
          python -m http.server 8000
          EOF
          cat > RUN_LOCAL.py <<'EOF'
          import http.server
          import socketserver
          import webbrowser
          PORT = 8000
          Handler = http.server.SimpleHTTPRequestHandler
          with socketserver.TCPServer(("", PORT), Handler) as httpd:
              print(f"English Master: http://127.0.0.1:{PORT}/")
              webbrowser.open(f"http://127.0.0.1:{PORT}/")
              httpd.serve_forever()
          EOF
          cat > README_RUN.txt <<'EOF'
          ENGLISH MASTER V7.0.0 — REAL DATA BACKUP

          Copied from the GitHub repository exist8506-bot/english-master-data.
          Includes the real app source and all repository data files.

          Windows:
          1. Install Python 3 if needed.
          2. Double-click RUN_LOCAL.bat.
          3. Open http://127.0.0.1:8000/ if it does not open automatically.

          Learning progress is stored in browser localStorage.
          EOF

      - name: Create ZIP backup
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/English_Master_RealData.zip . -x '.git/*' 'dist/*'

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: English_Master_RealData
          path: dist/English_Master_RealData.zip
          if-no-files-found: error
