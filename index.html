<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b5bd6" />
  <meta name="application-version" content="3.3.0" />
  <title>English Master — Learn • Practice • Remember • Improve</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <button id="mobileMenu" class="icon-btn mobile-only" aria-label="Mở menu">☰</button>
        <div class="brand-mark">E</div>
        <div>
          <div class="brand-name">English Master <span class="small muted">V3.3</span></div>
          <div class="brand-tagline">Learn • Practice • Remember • Improve</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="streak-pill">🔥 <span id="topStreak">0</span> ngày</div>
        <button id="notificationBtn" class="icon-btn" title="Thông báo">🔔</button>
        <button id="themeBtn" class="icon-btn" title="Đổi giao diện">◐</button>
        <button id="settingsBtn" class="icon-btn" title="Cài đặt">⚙️</button>
        <button id="profileBtn" class="profile-chip"><span id="avatarText">H</span><span id="profileNameTop">Learner</span></button>
      </div>
    </header>

    <aside id="sidebar" class="sidebar">
      <nav>
        <button class="nav-item active" data-view="home">🏠 <span>Trang chủ</span></button>
        <button class="nav-item" data-view="learn">📚 <span>Học từ vựng</span></button>
        <button class="nav-item" data-view="sentences">💬 <span>Học câu</span></button>
        <button class="nav-item" data-view="flashcards">🃏 <span>Flashcards</span></button>
        <button class="nav-item" data-view="quiz">📝 <span>Trắc nghiệm</span></button>
        <button class="nav-item" data-view="listening">🎧 <span>Luyện nghe</span></button>
        <button class="nav-item" data-view="speaking">🎙️ <span>Phát âm</span></button>
        <button class="nav-item" data-view="grammar">📖 <span>Ngữ pháp</span></button>
        <button class="nav-item" data-view="communication">🗣️ <span>Giao tiếp</span></button>
        <button class="nav-item" data-view="trilingual">🌏 <span>Tam ngữ</span></button>
        <button class="nav-item" data-view="review">🔄 <span>Ôn tập thông minh</span></button>
        <button class="nav-item" data-view="library">🗂️ <span>Thư viện của tôi</span></button>
        <button class="nav-item" data-view="stats">📊 <span>Thống kê</span></button>
        <button class="nav-item" data-view="profile">👤 <span>Hồ sơ</span></button>
        <button class="nav-item" data-view="settings">⚙️ <span>Cài đặt</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="level-card">
          <div class="level-head"><span>Level <strong id="sideLevel">1</strong></span><span><b id="sideXP">0</b> XP</span></div>
          <div class="progress"><div id="sideXpBar" class="progress-bar" style="width:0%"></div></div>
          <small id="sideLevelLabel">Beginner</small>
        </div>
      </div>
    </aside>

    <main id="main" class="main">
      <div id="toast" class="toast" role="status"></div>
      <div id="view"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
